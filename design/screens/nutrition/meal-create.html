<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — Log Meal</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <button class="back-btn" onclick="goBack()"><svg width="16" height="16" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M10 3l-5 5 5 5" />
                    </svg></button>
                <span class="hdr-title">Log Meal</span>
            </div>

            <div class="screen-scroll px16 pb16 stack-14">

                <div class="field">
                    <label class="field-label">Date</label>
                    <input class="input" type="date" value="2026-09-10" />
                </div>

                <div class="field">
                    <label class="field-label">Meal Type</label>
                    <div class="tabs-list">
                        <button class="tab-trigger active" onclick="selectTab(this)">Breakfast</button>
                        <button class="tab-trigger" onclick="selectTab(this)">Lunch</button>
                        <button class="tab-trigger" onclick="selectTab(this)">Dinner</button>
                        <button class="tab-trigger" onclick="selectTab(this)">Snack</button>
                    </div>
                </div>

                <!-- Foods added -->
                <div>
                    <div class="sec-hdr">
                        <span class="sec-title">Foods</span>
                        <a href="food-search.html" class="btn-link">+ Add Food</a>
                    </div>
                    <div class="stack-8" id="foods-list">
                        <div class="row-10 card" style="padding:10px 12px;border-radius:var(--r-xl)">
                            <div style="font-size:18px">🌾</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold">Oatmeal</div>
                                <div class="text-xs text-muted">100g · 68 kcal</div>
                            </div>
                            <button onclick="this.closest('.card').remove()"
                                style="background:none;border:none;color:var(--red);cursor:pointer">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 14 14">
                                    <path d="M2 2l10 10M12 2L2 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="row-10 card" style="padding:10px 12px;border-radius:var(--r-xl)">
                            <div style="font-size:18px">🥚</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold">Eggs (×3)</div>
                                <div class="text-xs text-muted">180g · 279 kcal</div>
                            </div>
                            <button onclick="this.closest('.card').remove()"
                                style="background:none;border:none;color:var(--red);cursor:pointer">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 14 14">
                                    <path d="M2 2l10 10M12 2L2 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <a href="food-search.html" class="btn btn-outline btn-full" style="border-style:dashed">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M8 2v12M2 8h12" />
                    </svg>
                    Add More Foods
                </a>

                <!-- Running total -->
                <div
                    style="padding:12px 14px;background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:var(--r-xl)">
                    <div class="row-sb">
                        <span class="text-sm font-semibold text-muted">Total Calories</span>
                        <span class="text-lg font-extrabold text-green">347 kcal</span>
                    </div>
                    <div class="row-8" style="margin-top:6px">
                        <span class="text-xs text-muted">P: <b class="text-primary">27g</b></span>
                        <span class="text-xs text-muted">C: <b class="text-yellow">14g</b></span>
                        <span class="text-xs text-muted">F: <b class="text-purple">20g</b></span>
                    </div>
                </div>

                <button class="btn btn-default btn-full"
                    onclick="toast('Meal logged!');window.location.href='meals.html'">Save Meal</button>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../js/app.js"></script>
    <script>renderNav('nutrition');</script>
</body>

</html>
