<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — New Exercise</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <button class="back-btn" onclick="goBack()"><svg width="16" height="16" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M10 3l-5 5 5 5" />
                    </svg></button>
                <span class="hdr-title">New Exercise</span>
            </div>

            <div class="screen-scroll px16 pb16 stack-14">
                <div class="field">
                    <label class="field-label">Exercise Name</label>
                    <input class="input" placeholder="e.g. Bench Press" value="" />
                </div>
                <div class="field">
                    <label class="field-label">Muscle Group</label>
                    <select class="input">
                        <option value="">Select a group…</option>
                        <option>Chest</option>
                        <option>Back</option>
                        <option>Shoulders</option>
                        <option>Biceps</option>
                        <option>Triceps</option>
                        <option>Legs</option>
                        <option>Core</option>
                        <option>Cardio</option>
                    </select>
                </div>
                <button class="btn btn-default btn-full"
                    onclick="toast('Exercise saved!');window.location.href='list.html'">Save Exercise</button>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../js/app.js"></script>
    <script>renderNav('exercises');</script>
</body>

</html>
