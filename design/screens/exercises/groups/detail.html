<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — Group Detail</title>
    <link rel="stylesheet" href="../../../styles/globals.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <a href="list.html" class="back-btn"><svg width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M10 3l-5 5 5 5" />
                    </svg></a>
                <span class="hdr-title">Chest</span>
                <div class="hdr-actions">
                    <a href="create.html" class="btn-icon"><svg width="14" height="14" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 14 14">
                            <path d="M9.5 1.5l3 3-7.5 7.5L1.5 12l.5-3.5 7.5-7.5z" />
                        </svg></a>
                    <button class="btn-icon btn-icon-danger" onclick="toast('Group deleted')"><svg width="14"
                            height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 14 14">
                            <path d="M2.5 3.5h9M5.5 3.5V2h3v1.5M4.5 3.5l.5 9h4l.5-9" />
                        </svg></button>
                </div>
            </div>

            <div class="screen-scroll px16 pb16 stack-14">
                <!-- Hero -->
                <div
                    style="background:var(--primary-dim);border:1px solid rgba(59,130,246,.2);border-radius:var(--r-3xl);padding:18px;display:flex;align-items:center;gap:14px">
                    <div style="font-size:40px">🫁</div>
                    <div>
                        <div class="text-xl font-extrabold">Chest</div>
                        <div class="text-xs text-muted" style="margin-top:4px">3 exercises · Used in 18 sessions</div>
                    </div>
                </div>

                <!-- Exercises list -->
                <div>
                    <div class="sec-hdr">
                        <span class="sec-title">Exercises</span>
                        <a href="../create.html" class="btn-link">+ Add Exercise</a>
                    </div>
                    <div class="stack-8">
                        <a href="../detail.html" class="list-item">
                            <div class="li-icon" style="background:var(--primary-dim)">🏋️</div>
                            <div class="li-body">
                                <div class="li-title">Bench Press</div>
                                <div class="li-sub">14 sessions</div>
                            </div><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" viewBox="0 0 14 14" class="chev">
                                <path d="M5 3l4 4-4 4" />
                            </svg>
                        </a>
                        <a href="../detail.html" class="list-item">
                            <div class="li-icon" style="background:var(--primary-dim)">💪</div>
                            <div class="li-body">
                                <div class="li-title">Incline DB Press</div>
                                <div class="li-sub">8 sessions</div>
                            </div><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" viewBox="0 0 14 14" class="chev">
                                <path d="M5 3l4 4-4 4" />
                            </svg>
                        </a>
                        <a href="../detail.html" class="list-item">
                            <div class="li-icon" style="background:var(--primary-dim)">🤸</div>
                            <div class="li-body">
                                <div class="li-title">Cable Flyes</div>
                                <div class="li-sub">6 sessions</div>
                            </div><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" viewBox="0 0 14 14" class="chev">
                                <path d="M5 3l4 4-4 4" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../../js/app.js"></script>
    <script>renderNav('exercises');</script>
</body>

</html>
