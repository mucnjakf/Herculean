<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — New Group</title>
    <link rel="stylesheet" href="../../../styles/globals.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />

                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <button class="back-btn" onclick="goBack()"><svg width="16" height="16" fill="none"

                        <path d="M10 3l-5 5 5 5" />
                    </svg></button>
                <span class="hdr-title">New Group</span>
            </div>

            <div class="screen-scroll px16 pb16 stack-14">

                    <label class="field-label">Group Name</label>
                    <input class="input" placeholder="e.g. Chest, Back, Legs…" />
                </div>
                <button class="btn btn-default btn-full"
                    onclick="toast('Group saved!');window.location.href='list.html'">Save Group</button>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>

    <script src="../../../js/app.js"></script>
    <script>renderNav('exercises');</script>
