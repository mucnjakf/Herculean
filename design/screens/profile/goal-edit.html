<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — Set Goal</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <a href="goal.html" class="back-btn"><svg width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M10 3l-5 5 5 5" />
                    </svg></a>
                <span class="hdr-title">Set Goal</span>
            </div>

            <div class="screen-scroll px16 pb16 stack-14">

                <!-- TDEE hint -->
                <div
                    style="padding:10px 12px;background:var(--primary-dim);border:1px solid rgba(59,130,246,.25);border-radius:var(--r-xl)">
                    <div class="text-xs font-bold text-primary">💡 Tip</div>
                    <div class="text-xs text-muted" style="margin-top:3px;line-height:1.5">Based on your profile, your
                        estimated TDEE is <b style="color:var(--fg)">2,650 kcal/day</b>. Values below are pre-filled.
                    </div>
                </div>

                <!-- Calorie target -->
                <div class="field">
                    <label class="field-label">Daily Calorie Target</label>
                    <div class="input-unit-wrap"><input class="input" type="number" value="2800" id="cal-goal"
                            oninput="updateTotal()" /><span class="input-unit">kcal</span></div>
                </div>

                <!-- Macro targets -->
                <div class="field">
                    <label class="field-label" style="margin-bottom:6px">Macronutrient Targets</label>
                    <div class="card card-p stack-10">
                        <div class="row-12">
                            <div
                                style="width:10px;height:10px;border-radius:50%;background:var(--primary);flex-shrink:0">
                            </div>
                            <span class="text-sm font-semibold flex-1">Protein</span>
                            <div class="input-unit-wrap" style="width:96px"><input class="input" type="number"
                                    value="200" id="protein-g" oninput="updateTotal()"
                                    style="padding:8px 36px 8px 10px;height:36px;font-size:14px" /><span
                                    class="input-unit" style="font-size:12px">g</span></div>
                        </div>
                        <div class="sep"></div>
                        <div class="row-12">
                            <div
                                style="width:10px;height:10px;border-radius:50%;background:var(--yellow);flex-shrink:0">
                            </div>
                            <span class="text-sm font-semibold flex-1">Carbohydrates</span>
                            <div class="input-unit-wrap" style="width:96px"><input class="input" type="number"
                                    value="300" id="carbs-g" oninput="updateTotal()"
                                    style="padding:8px 36px 8px 10px;height:36px;font-size:14px" /><span
                                    class="input-unit" style="font-size:12px">g</span></div>
                        </div>
                        <div class="sep"></div>
                        <div class="row-12">
                            <div
                                style="width:10px;height:10px;border-radius:50%;background:var(--purple);flex-shrink:0">
                            </div>
                            <span class="text-sm font-semibold flex-1">Fat</span>
                            <div class="input-unit-wrap" style="width:96px"><input class="input" type="number"
                                    value="80" id="fat-g" oninput="updateTotal()"
                                    style="padding:8px 36px 8px 10px;height:36px;font-size:14px" /><span
                                    class="input-unit" style="font-size:12px">g</span></div>
                        </div>
                    </div>
                </div>

                <!-- Total from macros -->
                <div
                    style="padding:12px 14px;background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:var(--r-xl)">
                    <div class="row-sb">
                        <span class="text-xs text-muted font-semibold">Total from macros</span>
                        <span class="text-sm font-extrabold text-green" id="macro-total">2,720 kcal</span>
                    </div>
                    <div class="text-xs text-subtle" style="margin-top:3px" id="macro-formula">(200×4) + (300×4) +
                        (80×9) = 800+1200+720</div>
                </div>

                <button class="btn btn-default btn-full"
                    onclick="toast('Goal saved!');window.location.href='goal.html'">Save Goal</button>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../js/app.js"></script>
    <script>
        renderNav('profile');
        function updateTotal() {
            const p = parseInt(document.getElementById('protein-g').value) || 0;
            const c = parseInt(document.getElementById('carbs-g').value) || 0;
            const f = parseInt(document.getElementById('fat-g').value) || 0;
            const total = p * 4 + c * 4 + f * 9;
            document.getElementById('macro-total').textContent = total.toLocaleString() + ' kcal';
            document.getElementById('macro-formula').textContent =
                `(${p}×4) + (${c}×4) + (${f}×9) = ${p * 4}+${c * 4}+${f * 9}`;
        }
    </script>
</body>

</html>
