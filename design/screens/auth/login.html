<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — Sign In</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <style>
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0;
        }

        .auth-divider .dl {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-divider span {
            font-size: 11px;
            font-weight: 600;
            color: var(--fg-subtle);
        }
    </style>
</head>

<body>
    <span class="side-label">HERCULEAN</span>

    <div class="phone">
        <div class="screen">

            <!-- Status bar -->
            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons">
                    <svg width="17" height="12" fill="currentColor" viewBox="0 0 17 12">
                        <rect x="0" y="7" width="2.5" height="5" rx=".8" />
                        <rect x="4" y="5" width="2.5" height="7" rx=".8" />
                        <rect x="8" y="3" width="2.5" height="9" rx=".8" />
                        <rect x="12" y="0" width="2.5" height="12" rx=".8" />
                    </svg>
                    <svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg>
                </div>
            </div>

            <!-- Logo area -->
            <div class="auth-logo-area">
                <div class="logo-box">
                    <svg width="36" height="36" fill="none" viewBox="0 0 36 36">
                        <rect x="4" y="13" width="5" height="10" rx="2" fill="white" />
                        <rect x="9" y="10" width="4" height="16" rx="2" fill="white" />
                        <rect x="23" y="13" width="5" height="10" rx="2" fill="white" />
                        <rect x="23" y="10" width="4" height="16" rx="2" fill="white" />
                        <rect x="13" y="16" width="10" height="4" rx="2" fill="white" />
                    </svg>
                </div>
                <div class="logo-name">HERCULEAN</div>
                <div class="logo-tagline">Master Your Fitness Journey</div>
            </div>

            <!-- Form -->
            <div class="auth-form">
                <div class="field">
                    <label class="field-label">Email</label>
                    <input class="input" type="email" placeholder="you@example.com" value="filip@example.com" />
                </div>
                <div class="field">
                    <label class="field-label">Password</label>
                    <input class="input" type="password" value="••••••••" />
                </div>
                <div style="text-align:right">
                    <button class="btn-link">Forgot password?</button>
                </div>
                <a href="../dashboard/home.html" class="btn btn-default btn-full" style="margin-top:4px">Sign In</a>
                <div class="auth-divider">
                    <div class="dl"></div>
                    <span>OR</span>
                    <div class="dl"></div>
                </div>
                <a href="register.html" class="btn btn-secondary btn-full">Create Account</a>
            </div>

            <div class="auth-footer">
                Don't have an account?&nbsp;
                <a href="register.html" class="auth-link">Get started</a>
            </div>
        </div>
    </div>

    <span class="side-label">DESIGN REF →</span>

    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../js/app.js"></script>
</body>

</html>
