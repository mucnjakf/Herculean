<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Herculean — New Session</title>
    <link rel="stylesheet" href="../../styles/globals.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
</head>

<body>
    <span class="side-label">HERCULEAN</span>
    <div class="phone">
        <div class="screen has-nav">

            <div class="status-bar">
                <span class="sb-time">9:41</span>
                <div class="sb-icons"><svg width="26" height="12" fill="currentColor" viewBox="0 0 26 12">
                        <rect x=".5" y="1.5" width="21" height="9" rx="2" fill="none" stroke="currentColor"
                            stroke-width="1" />
                        <rect x="2" y="3" width="16" height="6" rx="1" />
                        <path d="M23 4.5v3a1.5 1.5 0 000-3z" />
                    </svg></div>
            </div>

            <div class="screen-hdr px16">
                <button class="back-btn" onclick="goBack()"><svg width="16" height="16" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M10 3l-5 5 5 5" />
                    </svg></button>
                <span class="hdr-title">New Session</span>
            </div>

            <div class="screen-scroll px16 pb16 stack-16">

                <div class="field">
                    <label class="field-label">Date</label>
                    <input class="input" type="date" value="2026-09-10" />
                </div>

                <!-- Added workouts -->
                <div>
                    <div class="sec-hdr">
                        <span class="sec-title">Workouts</span>
                        <a href="workout-add.html" class="btn-link">+ Add</a>
                    </div>
                    <div class="stack-8" id="wo-list">
                        <div class="wo-row">
                            <div
                                style="width:34px;height:34px;background:var(--primary-dim);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:16px">
                                🏋️</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold">Bench Press</div>
                                <div class="text-xs text-muted">Chest · 4 sets</div>
                            </div>
                            <button onclick="toast('Removed')"
                                style="background:none;border:none;color:var(--red);padding:4px;cursor:pointer">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 14 14">
                                    <path d="M2 2l10 10M12 2L2 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="wo-row">
                            <div
                                style="width:34px;height:34px;background:var(--purple-dim);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:16px">
                                💪</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold">Overhead Press</div>
                                <div class="text-xs text-muted">Shoulders · 4 sets</div>
                            </div>
                            <button onclick="toast('Removed')"
                                style="background:none;border:none;color:var(--red);padding:4px;cursor:pointer">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 14 14">
                                    <path d="M2 2l10 10M12 2L2 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="wo-row">
                            <div
                                style="width:34px;height:34px;background:var(--green-dim);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:16px">
                                🏋️</div>
                            <div class="flex-1">
                                <div class="text-sm font-bold">Tricep Pushdown</div>
                                <div class="text-xs text-muted">Triceps · 3 sets</div>
                            </div>
                            <button onclick="toast('Removed')"
                                style="background:none;border:none;color:var(--red);padding:4px;cursor:pointer">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 14 14">
                                    <path d="M2 2l10 10M12 2L2 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <a href="workout-add.html" class="btn btn-outline btn-full" style="border-style:dashed">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" viewBox="0 0 16 16">
                        <path d="M8 2v12M2 8h12" />
                    </svg>
                    Add Another Workout
                </a>

                <button class="btn btn-default btn-full"
                    onclick="toast('Session saved!');window.location.href='calendar.html'">Save Session</button>
            </div>

            <div id="nav-container"></div>
        </div>
    </div>
    <span class="side-label">DESIGN REF →</span>
    <div id="toast-wrap">
        <div class="toast" id="toast"></div>
    </div>
    <script src="../../js/app.js"></script>
    <script>renderNav('calendar');</script>
</body>

</html>
